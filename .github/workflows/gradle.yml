name: Java CICD with Gradle,Docker,EC2

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build without tests
      run: ./gradlew build -x test

    - name: Docker login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Docker build & push
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/lingo-be-server:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/lingo-be-server:latest

    - name: Deploy to EC2 via SSH (compose)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        port: ${{ secrets.EC2_SSH_PORT || 22 }}
        script: |
          set -e
          mkdir -p ~/app && cd ~/app
          
          #.env파일
          cat > .env <<'ENV'
          SPRING_PROFILES_ACTIVE=prod
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          
          REDIS_HOST=redis
          REDIS_PORT=6379
          
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
          S3_REGION=${{ secrets.S3_REGION }}
          
          APP_PASSWORD=${{ secrets.APP_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          FASTAPI_BASE_URL=${{ secrets.FASTAPI_BASE_URL }}
          FASTAPI_TIMEOUT_MILLIS=${{ secrets.FASTAPI_TIMEOUT_MILLIS }}
          ENV
          
          cat > docker-compose.yml <<'YAML'
          services:
            redis:
              image: redis:7
              restart: unless-stopped
          
            application:
              image: ${{ secrets.DOCKER_USERNAME }}/lingo-be-server:latest
              container_name: app
              env_file: .env
              depends_on:
                - redis
              ports:
                - "8081:8080"
              restart: unless-stopped
          YAML
          
          #배포
          docker compose pull
          docker compose up -d
          docker compose ps