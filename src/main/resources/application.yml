spring:
  datasource:
    url: jdbc:h2:tcp://localhost/~/lingo
    username: sa
    password:
    driver-class-name: org.h2.Driver
  thymeleaf:
  prefix: classpath:/templates/
  suffix: .html
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: 2025lingo@gmail.com # 구글 이메일 주소
    password: ${APP_PASSWORD}  # 구글 이메일 비밀번호
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    auth-code-expiration-millis: 1800000  # 30 * 60 * 1000 = 30분

logging.level:
  org.hibernate.SQL: debug
  org.hibernate.orm.jdbc.bind: trace #스프링 부트 3.x, hibernate6

springdoc:
  swagger-ui:
    path: /swagger-ui.html  # swagger UI 페이지 경로
    enabled: true           # swagger UI 사용 여부
    tags-sorter: alpha      # 태그 정렬 방식 (알파벳순)
    operations-sorter: alpha  # API operation 정렬 방식 (알파벳순)

  api-docs:
    path: /api-docs         # Swagger UI가 참조할 API docs 경로

  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

cloud:
  aws:
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    s3:
      bucket: ${S3_BUCKET_NAME}
    region:
      static: ${S3_REGION}
    stack:
      auto: false

jwt:
  secret: ${JWT_SECRET}  # JWT 비밀 키